name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: finbridge_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finbridge_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AUTH_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/finbridge_auth_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Initialize isolated test database
        run: npm run auth:migrate
        env:
          DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/finbridge_auth_test
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: synthetic-ci-only-secret-at-least-32-characters
          GOOGLE_CLIENT_ID: synthetic-ci-client
          GOOGLE_CLIENT_SECRET: synthetic-ci-secret

      - name: Business unit and onboarding tests
        run: npm run test:business:unit

      - name: Business PostgreSQL tests
        run: npm run test:business:postgres

      - name: Build
        run: npm run build
